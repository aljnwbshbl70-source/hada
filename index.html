function confetti() { var c = ['#a8832c', '#0f5a43', '#e6c46f', '#3fae86', '#b3392f']; for (var i = 0; i < 18; i++) { var e = document.createElement('span'); e.className = 'cf'; e.style.cssText = 'left:' + Math.random() * 100 + '%;background:' + c[i % 5] + ';animation-delay:' + Math.random() * .8 + 's'; document.body.appendChild(e); setTimeout(() => e.remove(), 4500); } }
function startTimer(mins) {

function drawStudent() {

  if (st.step === 'closed') { A.innerHTML = shell('<div class="card"><div class="err" style="margin:0">هذا الاختبار مغلق حاليًا أو انتهت فترة إتاحته.</div></div>', t); return; }

    A.innerHTML = shell('<div class="card"><p class="dua">وقل ربّ زدني علمًا</p>' + (st.info.welcome ? '<div class="hint" style="margin-bottom:10px">' + esc(st.info.welcome).replace(/\n/g, '<br>') + '</div>' : '') +
      (st.info.duration > 0 ? '<div style="text-align:center"><span class="timer">⏱ مدة الاختبار: ' + st.info.duration + ' دقيقة</span></div>' : '') +
      '<label class="f" for="s-name">الاسم الثلاثي</label><input id="s-name" placeholder="مثال: فاطمة محمد أحمد">' +
      '<label class="f" for="s-id">رقم الهوية</label><input id="s-id" inputmode="numeric">' +
      '<label class="f" for="s-ph">رقم الجوال</label><input id="s-ph" inputmode="tel" placeholder="05xxxxxxxx">' +
      (st.err ? '<div class="err">' + esc(st.err) + '</div>' : '') + '<button class="pri full" data-act="s-start">ابدئي الاختبار</button>' + linksHtml() + '</div>', t);
    return;
  }
  if (st.step === 'quiz') {
    var q = st.qs[st.i], n = st.qs.length, done = st.a.filter(x => x !== null).length;
    A.innerHTML = shell('<div class="card"><div class="bar"><i style="width:' + ((st.i + 1) / n * 100) + '%"></i></div>' +
      '<div class="dots">' + st.qs.map((_, i) => '<button class="' + (st.a[i] !== null ? 'd ' : '') + (i === st.i ? 'c' : '') + '" data-act="s-go" data-i="' + i + '" aria-label="سؤال ' + (i + 1) + '">' + (i + 1) + '</button>').join('') + '</div>' + '<div class="meta"><span>السؤال ' + (st.i + 1) + ' من ' + n + '</span>' + (st.info.duration > 0 ? '<span class="timer" id="timer-display">--:--</span>' : '') + '<span>أجبتِ على ' + done + '</span></div>' +
      '<span class="qtype">' + (q.type === 'tf' ? 'اختاري صح أو خطأ' : 'اختاري الإجابة الصحيحة') + '</span><div class="qtext">' + esc(q.text) + '</div>' +
      optsOf(q).map((x, i) => '<button class="opt' + (st.a[st.i] === i ? ' sel' : '') + '" data-act="s-pick" data-i="' + i + '"><b>' + (LET[i] || i + 1) + '</b><span>' + esc(x) + '</span></button>').join('') +
      (st.err ? '<div class="err">' + esc(st.err) + '</div>' : '') +
      '<div class="nav"><button data-act="s-prev"' + (st.i ? '' : ' style="visibility:hidden"') + '>السابق</button><button class="pri" data-act="s-next">' + (st.i === n - 1 ? 'إنهاء الاختبار' : 'التالي') + '</button></div></div>', t);
    updTimer(); return;
  }
  var r = st.res, h = '<div class="card res"><p class="dua">تقبّل الله منكِ</p>';
  if (r.mode === 'sent') h += '<div class="big">✓</div><h2>تم إرسال نتيجتك للإدارة بنجاح</h2>';
  else {
    var pp = Math.round(r.score / r.total * 100), ok = pp >= (st.info.passScore || 50);
    h += '<h2>نتيجتك</h2><div class="gauge" style="--p:' + pp + '"><span>' + r.score + '/' + r.total + '</span></div><p style="font-weight:700;font-size:18px">' + (ok ? '🎉 ما شاء الله، مبارك نجاحكِ!' : '🌱 لا بأس، المحاولة بداية الطريق وأنتِ قادرة بإذن الله.') + '</p>'; if (ok) confetti();

      if (pct(rr) >= (st.info.passScore || 50)) h += certHtml(st.info, rr);
      else h += '<div class="err">لم تحققي نسبة النجاح المطلوبة للشهادة (' + (st.info.passScore || 50) + '%).</div>';
    }
  }
  A.innerHTML = shell(h + linksHtml() + '</div>', t);
}

const fixLink = (v, k) => { v = String(v || '').trim(); if (!v) return ''; if (/^https?:\/\//i.test(v)) return v; if (k === 'w' && /^[\d\s+٠-٩]+$/.test(v)) return 'https://wa.me/966' + normPhone(v); return 'https://' + v.replace(/^@/, k === 'i' ? 'instagram.com/' : ''); };

async function submitExam() {
  if (st.sending) return; st.sending = true; clearInterval(st.tid);
  var cn = 'S-' + uid().toUpperCase(), score = 0, wrong = [], ans = new Array(st.qs.length).fill(null);
  st.qs.forEach((q, i) => {
    var u = st.a[i]; ans[q.oi] = u;
    if (u === q.correct) score++;
    else { var o = optsOf(q); wrong.push({ n: i + 1, text: q.text, yours: u != null ? o[u] : 'بدون إجابة', correct: o[q.correct] }); }
  });
  try {
    if (!PREVIEW) await setDoc(doc(db, "results", st.examId + '_' + st.sd.nid), { examId: st.examId, name: st.sd.name, nid: st.sd.nid, phone: st.sd.phone, answers: ans, score, total: st.qs.length, at: Date.now(), cn });
    try { localStorage.removeItem('ans_' + st.examId + '_' + st.sd.nid); localStorage.removeItem('start_' + st.examId + '_' + st.sd.nid); } catch (e) {} st.res = { score, total: st.qs.length, mode: st.info.mode, wrong, cn, at: Date.now() }; st.step = 'done'; drawStudent(); scrollTo(0, 0);
  } catch (e) { st.sending = false; st.err = 'تعذر إرسال الإجابات، تأكدي من الإنترنت وأعيدي المحاولة'; drawStudent(); }
}

async function saveExam(btn) {
  syncEd(); var e = ui.ed, err = '', qs = [];
  if (!e.title.trim()) err = 'اكتبي عنوان الاختبار';
  else if (e.passScore < 1 || e.passScore > 100) err = 'نسبة النجاح لازم تكون بين 1 و100';
  else e.questions.forEach((q, i) => {
    if (err) return;
    if (!q.text.trim()) { err = 'السؤال ' + (i + 1) + ' بدون نص'; return; }
    if (q.type === 'tf') { qs.push({ text: q.text.trim(), type: 'tf', options: [], correct: q.correct }); return; }
    var o = q.options.map(x => x.trim());
    if (!o[q.correct]) { err = 'السؤال ' + (i + 1) + ': الإجابة الصحيحة المحددة خيارها فارغ'; return; }
    var nc = o.slice(0, q.correct).filter(Boolean).length, op = o.filter(Boolean);
    if (op.length < 2) { err = 'السؤال ' + (i + 1) + ' يحتاج خيارين على الأقل'; return; }
    qs.push({ text: q.text.trim(), type: 'mcq', options: op, correct: nc });
  });
  if (!err && !qs.length) err = 'أضيفي سؤالًا واحدًا على الأقل';
  if (err) { ui.eerr = err; drawAdmin(); scrollTo(0, document.body.scrollHeight); return; }
  var code = e.code || (/[a-z0-9]/i.test(e.title) ? slugify(e.title).replace(/[^\x00-\x7F]/g, '').replace(/^-+|-+$/g, '') : '') || ('e' + uid().slice(0, 4));
  if (A.exams.some(x => x.code === code && x.id !== e.id)) { ui.eerr = 'يوجد اختبار آخر بنفس الرابط، غيّري الرابط أو اسم الاختبار'; drawAdmin(); return; }
  ui.eerr = ''; busy(btn, 'جاري الحفظ...');
  var d = { code: code, color: e.color || 'green', welcome: (e.welcome || '').trim(), createdAt: e.createdAt || Date.now(), title: e.title.trim(), date: e.date || '', duration: e.duration, orgName: e.orgName, teacherName: e.teacherName, active: e.active, shuffle: e.shuffle, hasCert: e.hasCert, passScore: e.passScore, mode: e.mode, checkId: e.checkId, checkPhone: e.checkPhone, questions: qs };
  try {
    if (e.id) { await setDoc(doc(db, "exams", e.id), d); var ix = A.exams.findIndex(x => x.id === e.id); A.exams[ix] = { id: e.id, ...d }; }
    else { var r = await addDoc(collection(db, "exams"), d); A.exams.unshift({ id: r.id, ...d }); }
    ui.ed = null; toast('تم حفظ الاختبار'); drawAdmin();
  } catch (x) { ui.eerr = 'تعذر الحفظ، تأكدي من الإنترنت'; drawAdmin(); }
}

function statsOf(ex, rs) {
  var n = rs.length; if (!n) return { n: 0 };

    err: ex.questions.map((q, i) => Math.round(rs.filter(r => !r.answers || r.answers[i] !== q.correct).length / n * 100)) };
}

    var r = A.results.find(x => x.id === v.rid), e2 = r && A.exams.find(e => e.id === r.examId);
    if (!r || !e2) { ui.rv = { view: 'list' }; drawAdmin(); return; }
    h = '<div class="row" style="margin-bottom:12px"><button data-act="back-exam" data-id="' + e2.id + '">← ' + esc(e2.title) + '</button><span class="grow"></span><button class="pri" data-act="show-cert" data-id="' + esc(r.id) + '">🎓 شهادة الطالبة</button><a class="b" target="_blank" rel="noopener" href="' + esc(wa(r, e2)) + '">واتساب</a><button class="dan" data-act="del-res" data-id="' + esc(r.id) + '">' + (ui.delRes === r.id ? 'اضغطي للتأكيد' : 'السماح بإعادة المحاولة') + '</button></div>' +
      '<div class="card"><h3 style="margin-top:0">' + esc(r.name) + '</h3><div class="sub">الهوية: ' + esc(r.nid) + ' · الجوال: ' + esc(r.phone) + ' · ' + esc(fdate(r.at)) + '</div><div style="font-size:26px;font-weight:700;color:var(--primary)">' + r.score + ' / ' + r.total + ' <span class="sub">' + pct(r) + '%</span></div></div>' +
      e2.questions.map((qq, i) => {
        var a = r.answers ? r.answers[i] : null, ok = a === qq.correct;
        return '<div class="rq"><b>' + (i + 1) + '. ' + esc(qq.text) + '</b> <span class="tag ' + (ok ? 't-on' : 't-off') + '">' + (ok ? 'صحيحة' : a == null ? 'بدون إجابة' : 'خاطئة') + '</span>' +
          optsOf(qq).map((t, k) => '<div class="ro ' + (k === qq.correct ? 'good' : k === a ? 'bad' : '') + '">' + (k === qq.correct ? '✓ ' : k === a ? '✗ ' : '') + esc(t) + (k === a ? ' <span class="sub">(إجابتها)</span>' : '') + '</div>').join('') + '</div>';
      }).join('');
  }
  box.innerHTML = h;
}

/* ===== الأحداث ===== */
document.addEventListener('input', ev => {
  var id = ev.target.id || '';
  if (ui.certEd) drawCertPrev(); else if (id === 'rs') { ui.rq = ev.target.value; drawResBody(); }
  else if (id.indexOf('q-') === 0) { var k = id.slice(2), v = ev.target.value; document.querySelectorAll('#tb-' + k + ' tr').forEach(r => r.style.display = r.dataset.s.indexOf(v) >= 0 ? '' : 'none'); }
});
document.addEventListener('change', ev => { if (ev.target.classList.contains('qtype-sel') && ui.ed) { syncEd(); drawAdmin(); } else if (ev.target.id === 'l-logo') upLogo(ev.target.files[0]); else if (ui.certEd) drawCertPrev(); });
$('#dark-toggle').addEventListener('click', () => { document.body.classList.toggle('dark-mode'); try { localStorage.setItem('dark', document.body.classList.contains('dark-mode') ? '1' : '0'); } catch (e) {} });

document.addEventListener('click', async ev => {
  var b = ev.target.closest('[data-act]'); if (!b) return;
  var a = b.dataset.act, id = b.dataset.id, k = b.dataset.k;

  if (a === 's-start') {
    var name = $('#s-name').value.trim().replace(/\s+/g, ' '), nid = digits($('#s-id').value), ph = normPhone($('#s-ph').value), err = '';
    if (name.split(' ').length < 3) err = 'اكتبي اسمك الثلاثي كاملًا';
    else if (nid.length < 5) err = 'رقم الهوية غير صحيح';
    else if (ph.length < 9) err = 'رقم الجوال غير صحيح';
    if (err) { st.err = err; drawStudent(); return; }
    busy(b, 'جاري التحقق...');
    try {
      for (const [flag, key, val, msg] of [[st.info.checkId, 'ids', nid, 'رقم الهوية غير مسجل أو غير مفعّل'], [st.info.checkPhone, 'phones', ph, 'رقم الجوال غير مسجل أو غير مفعّل']]) {
        if (!flag) continue;
        const d = await getDoc(doc(db, "lists", key));
        if (!(d.exists() ? d.data().items || [] : []).some(x => x.v === val && x.on)) { st.err = msg; drawStudent(); return; }
      }
      if ((await getDoc(doc(db, "results", st.examId + '_' + nid))).exists()) { st.err = 'سبق أن أجريتِ هذا الاختبار'; drawStudent(); return; }
      st.sd = { name, nid, phone: ph };
      st.qs = st.info.questions.map((q, i) => ({ ...q, oi: i })); if (st.info.shuffle) st.qs = shuffle(st.qs);
      st.a = new Array(st.qs.length).fill(null);
      try { var sv = JSON.parse(localStorage.getItem('ans_' + st.examId + '_' + nid)); if (sv && sv.o && sv.o.length === st.qs.length) { var rq = sv.o.map(i => st.qs.find(q => q.oi === i)); if (rq.every(Boolean)) { st.qs = rq; st.a = sv.a; } } } catch (e) {}
      st.i = 0; st.err = ''; st.step = 'quiz'; drawStudent(); scrollTo(0, 0);
      if (st.info.duration > 0) startTimer(st.info.duration);
    } catch (e) { st.err = 'حدث خطأ أثناء البدء، حاولي مرة أخرى'; drawStudent(); }
    return;
  }
  if (a === 's-pick') { st.a[st.i] = +b.dataset.i; st.err = ''; saveAns(); drawStudent(); return; }
  if (a === 's-go') { st.i = +b.dataset.i; st.err = ''; st.warned = false; drawStudent(); return; }
  if (a === 's-prev') { if (st.i) st.i--; drawStudent(); return; }
  if (a === 's-next') {
    if (st.i < st.qs.length - 1) { st.i++; st.warned = false; st.err = ''; drawStudent(); return; }
    var left = st.a.filter(x => x === null).length;
    if (left && !st.warned) { st.warned = true; st.err = 'بقي ' + left + ' سؤال بدون إجابة. اضغطي «إنهاء» مرة ثانية للإرسال.'; drawStudent(); return; }
    busy(b, 'جاري الإرسال...'); submitExam(); return;
  }

  if (a === 'login') {
    var p = $('#pw').value.trim(); await loadPass();
    if (p === A.pass) { pw = p; try { sessionStorage.setItem('akt_pw', p); } catch (e) {} ui.loginErr = ''; loadAdmin(); }
    else { ui.loginErr = 'كلمة المرور غير صحيحة'; drawAdmin(); }
    return;
  }
  if (a === 'logout') { pw = ''; try { sessionStorage.removeItem('akt_pw'); } catch (e) {} drawAdmin(); return; }
  if (a === 'refresh') { loadAdmin(); return; }
  if (a === 'tab') { ui.tab = b.dataset.t; ui.rq = ''; ui.rv = { view: 'list' }; drawAdmin(); return; }
  if (a === 'save-pw') {
    var np = $('#np').value.trim(); if (np.length < 4) { toast('كلمة المرور لازم تكون 4 خانات أو أكثر', true); return; }
    try { await setDoc(doc(db, "settings", "admin"), { password: np }, { merge: true }); A.pass = np; A.set.password = np; pw = np; sessionStorage.setItem('akt_pw', np); $('#np').value = ''; toast('تم تغيير كلمة المرور'); } catch (e) { toast('تعذر الحفظ', true); }
    return;
  }
  if (a === 'save-def') { var ps = Math.min(100, Math.max(1, parseInt($('#d-pass').value) || 50)); A.set = { ...A.set, org: $('#d-org').value.trim(), teacher: $('#d-teacher').value.trim(), pass: ps, site: $('#d-site').value.trim() ? fixLink($('#d-site').value, '') : '' }; setBase(); try { await setDoc(doc(db, "settings", "admin"), { org: A.set.org, teacher: A.set.teacher, pass: ps, site: A.set.site }, { merge: true }); toast('تم حفظ القيم'); } catch (x) { toast('تعذر الحفظ', true); } return; }
  if (a === 'backup') { backup(); return; }
  if (a === 'new-exam') { ui.ed = { title: '', date: today(), duration: 0, orgName: A.set.org || '', teacherName: A.set.teacher || '', active: true, shuffle: false, hasCert: false, passScore: A.set.pass || 50, color: 'green', welcome: '', mode: 'score', checkId: false, checkPhone: false, questions: [blankQ()] }; ui.eerr = ''; drawAdmin(); scrollTo(0, 0); return; }
  if (a === 'edit' || a === 'dup') {
    ui.ed = JSON.parse(JSON.stringify(A.exams.find(e => e.id === id)));
    if (a === 'dup') { delete ui.ed.id; delete ui.ed.code; delete ui.ed.createdAt; ui.ed.title += ' (نسخة)'; ui.ed.active = false; }
    ui.ed.questions.forEach(q => { if (q.type === 'tf') q.options = []; });
    ui.eerr = ''; drawAdmin(); scrollTo(0, 0); return;
  }
  if (a === 'cancel-exam') { ui.ed = null; drawAdmin(); return; }
  if (a === 'add-q') { syncEd(); ui.ed.questions.push(blankQ()); drawAdmin(); return; }
  if (a === 'rm-q') { syncEd(); ui.ed.questions.splice(+b.dataset.i, 1); if (!ui.ed.questions.length) ui.ed.questions.push(blankQ()); drawAdmin(); return; }
  if (a === 'add-opt') { syncEd(); ui.ed.questions[+b.dataset.i].options.push(''); drawAdmin(); return; }
  if (a === 'save-exam') { saveExam(b); return; }
  if (a === 'copy-link') { copy(examLink(A.exams.find(e => e.id === id)), ok => toast(ok ? 'تم نسخ الرابط' : 'تعذر النسخ', !ok)); return; }
  if (a === 'export-excel') { exportExcel(id); return; }
  if (a === 'preview') { try { localStorage.setItem('akt_prev', Date.now()); } catch (e) {} window.open(location.origin + location.pathname + '?e=' + encodeURIComponent(A.exams.find(e => e.id === id).code) + '&p=1', '_blank'); return; }
  if (a === 'tog-cert') { var e5 = A.exams.find(e => e.id === id); e5.hasCert = !e5.hasCert; drawAdmin(); try { await setDoc(doc(db, "exams", id), { hasCert: e5.hasCert }, { merge: true }); toast(e5.hasCert ? 'ظهرت الشهادة للطالبات الناجحات' : 'تم إيقاف ظهور الشهادة'); } catch (x) { toast('تعذر التغيير', true); } return; }
  if (a === 'ce-open') { ui.certEd = id; ui.cert = null; drawAdmin(); scrollTo(0, 0); return; }
  if (a === 'ce-back') { ui.certEd = null; drawAdmin(); return; }
  if (a === 'ce-save') {
    var c5 = document.querySelector('input[name=ce-color]:checked'), e6 = A.exams.find(e => e.id === id), pv = Math.min(100, Math.max(1, parseInt($('#ce-pass').value) || 50));
    Object.assign(e6, { orgName: $('#ce-org').value.trim(), teacherName: $('#ce-teacher').value.trim(), dirName: $('#ce-dir').value.trim(), passScore: pv, certText: $('#ce-text').value.trim(), color: c5 ? c5.value : e6.color, hasCert: $('#ce-on').checked });
    try { await setDoc(doc(db, "exams", id), { orgName: e6.orgName, teacherName: e6.teacherName, dirName: e6.dirName, passScore: pv, certText: e6.certText, color: e6.color, hasCert: e6.hasCert }, { merge: true }); toast('تم حفظ الشهادة'); ui.certEd = null; } catch (x) { toast('تعذر الحفظ', true); }
    drawAdmin(); return;
  }
  if (a === 'save-links') { A.pub = { ...A.pub, insta: fixLink($('#l-insta').value, 'i'), wa: fixLink($('#l-wa').value, 'w') }; try { await setDoc(doc(db, "settings", "public"), A.pub); toast('تم حفظ الروابط'); } catch (x) { toast('تعذر الحفظ', true); } drawAdmin(); return; }
  if (a === 'rm-logo') { delete A.pub.logo; try { await setDoc(doc(db, "settings", "public"), A.pub); toast('تمت إزالة الشعار'); } catch (x) { toast('تعذر الحفظ', true); } drawAdmin(); return; }
  if (a === 'share') { var e7 = A.exams.find(e => e.id === id); copy('📝 ' + e7.title + '\nرابط الدخول للاختبار:\n' + examLink(e7) + '\nبالتوفيق 🌿', ok => toast(ok ? 'تم نسخ رسالة المشاركة' : 'تعذر النسخ', !ok)); return; }
  if (a === 'toggle') {
    var e2 = A.exams.find(e => e.id === id); e2.active = !e2.active; drawAdmin();
    try { await setDoc(doc(db, "exams", id), { active: e2.active }, { merge: true }); } catch (x) { toast('تعذر تغيير الحالة', true); }
    return;
  }
  if (a === 'del') {
    if (ui.delId !== id) { ui.delId = id; drawAdmin(); return; }
    ui.delId = null; A.exams = A.exams.filter(e => e.id !== id); A.results = A.results.filter(r => r.examId !== id); drawAdmin();
    try {
      const bt = writeBatch(db); bt.delete(doc(db, "exams", id));
      (await getDocs(query(collection(db, "results"), where("examId", "==", id)))).forEach(d => bt.delete(d.ref));
      await bt.commit();
    } catch (x) { toast('تعذر الحذف', true); }
    return;
  }
  if (a === 'add-list') {
    var n = 0;
    $('#add-' + k).value.split('\n').forEach(line => {
      var p = line.split(/[,،\t]/), v = k === 'ids' ? digits(p[0]) : normPhone(p[0]);
      if (v.length >= (k === 'ids' ? 5 : 9) && !A[k].some(i => i.v === v)) { A[k].push({ v, label: (p[1] || '').trim(), on: true }); n++; }
    });
    if (n) { pushList(k); toast('تمت إضافة ' + n); } else toast('لم تُضف أرقام جديدة', true);
    drawAdmin(); return;
  }
  if (a === 'all-list') { A[k].forEach(i => i.on = b.dataset.on === '1'); pushList(k); drawAdmin(); return; }
  if (a === 'tog-list') { var it = A[k].find(i => i.v === b.dataset.v); if (it) it.on = !it.on; pushList(k); drawAdmin(); return; }
  if (a === 'del-list') { A[k] = A[k].filter(i => i.v !== b.dataset.v); pushList(k); drawAdmin(); return; }

  if (a === 'open-exam') { ui.tab = 'results'; ui.rv = { view: 'exam', ex: id }; ui.rq = ''; drawAdmin(); scrollTo(0, 0); return; }
  if (a === 'open-stu') { ui.rv = { view: 'stu', rid: id }; ui.delRes = null; drawAdmin(); scrollTo(0, 0); return; }
  if (a === 'back-list') { ui.rv = { view: 'list' }; ui.rq = ''; drawAdmin(); return; }
  if (a === 'back-exam') { ui.rv = { view: 'exam', ex: id }; ui.rq = ''; drawAdmin(); return; }
  if (a === 'show-cert') { ui.cert = id; drawAdmin(); scrollTo(0, 0); return; }
  if (a === 'back-stu') { ui.cert = null; drawAdmin(); return; }
  if (a === 'del-res') {
    if (ui.delRes !== id) { ui.delRes = id; drawResBody(); return; }
    var ex3 = A.results.find(r => r.id === id).examId; ui.delRes = null; A.results = A.results.filter(r => r.id !== id); ui.rv = { view: 'exam', ex: ex3 }; drawAdmin();
    try { await deleteDoc(doc(db, "results", id)); toast('تم، تقدر الطالبة تعيد الاختبار'); } catch (x) { toast('تعذر حذف النتيجة', true); }
  }
});

if (VER) initVerify(); else if (CODE) initStudent(); else if (pw) { loadPass(); loadAdmin(); } else drawAdmin();
</script>
